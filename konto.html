<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>WRK2 – Konto</title>
<style>
:root{--text:#24292f;--muted:#6a737d;--accent:#1f6feb;--red:#a40e26;--green:#1a7f37}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1b2a3a;color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:10px;padding:24px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{font-size:19px;margin-bottom:4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}
p{font-size:14px;line-height:1.5;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
input{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:15px}
.btn{display:inline-block;padding:10px 16px;border-radius:6px;border:1px solid #d0d7de;background:#fff;font-size:14px;cursor:pointer;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.msg{min-height:18px;font-size:13px;margin-top:10px}
.msg.err{color:var(--red)}
.ok{color:var(--green);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <h1>WRK2 – Produksjonsplanlegging</h1>
  <div class="sub">Utkikksplan for byggeplassen</div>
  <div id="body"><p>Laster …</p></div>
</main>
<script type="module">
// Mottaksside for lenker i e-post fra Firebase (bekreft e-post, nytt passord, gjenopprett e-post).
// Ingenting utføres før brukeren trykker på knappen, slik at e-postskannere som åpner lenken ikke bruker den opp.
import { auth } from './fb.js';
import { applyActionCode, checkActionCode, verifyPasswordResetCode, confirmPasswordReset }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const q = new URLSearchParams(location.search);
const mode = q.get('mode'), code = q.get('oobCode');
const body = document.getElementById('body');
const appUrl = './' + (q.has('emulator') ? '?emulator' : '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ERR = {
  'auth/expired-action-code': 'Lenken har utløpt. Be om en ny lenke fra innloggingssiden.',
  'auth/invalid-action-code': 'Lenken er ugyldig eller allerede brukt. Hvis du allerede har bekreftet, kan du bare logge inn. Ellers ber du om en ny lenke.',
  'auth/user-disabled': 'Kontoen er deaktivert. Kontakt en systemadministrator.',
  'auth/user-not-found': 'Kontoen finnes ikke lenger.',
  'auth/weak-password': 'Passordet må ha minst 6 tegn.',
  'auth/network-request-failed': 'Får ikke kontakt med tjenesten. Sjekk nettforbindelsen og prøv igjen.'
};
const errText = e => ERR[e && e.code] || (e && e.message) || String(e);
const toApp = `<a class="btn" href="${appUrl}">Gå til WRK2</a>`;
const busy = (btn, on) => { btn.disabled = on; };

function show(html) { body.innerHTML = html; }
function fail(e) { show(`<p class="msg err">${esc(errText(e))}</p><div class="actions">${toApp}</div>`); }

if (!code || !mode) {
  show(`<p>Denne siden åpnes fra lenker i e-post fra WRK2. Lenken mangler noe, så den kan ikke brukes.</p><div class="actions">${toApp}</div>`);
} else if (mode === 'verifyEmail') {
  show(`<p>Trykk på knappen for å bekrefte e-postadressen din.</p>
    <div class="actions"><button class="btn primary" id="go">Bekreft e-postadressen</button></div><p class="msg" id="msg"></p>`);
  document.getElementById('go').onclick = async e => {
    busy(e.target, true);
    try {
      await applyActionCode(auth, code);
      show(`<p class="ok">E-postadressen er bekreftet.</p>
        <p>Har du WRK2 åpen i en annen fane, går du tilbake dit og trykker «Jeg har bekreftet». Ellers kan du logge inn her:</p>
        <div class="actions"><a class="btn primary" href="${appUrl}">Logg inn i WRK2</a></div>`);
    } catch (err) { fail(err); }
  };
} else if (mode === 'resetPassword') {
  verifyPasswordResetCode(auth, code).then(email => {
    show(`<p>Lag nytt passord for <b>${esc(email)}</b>.</p>
      <form id="f">
        <label>Nytt passord<input type="password" id="p1" autocomplete="new-password" minlength="6" required></label>
        <label>Gjenta passordet<input type="password" id="p2" autocomplete="new-password" minlength="6" required></label>
        <div class="actions"><button class="btn primary" type="submit" id="go">Lagre nytt passord</button></div>
        <p class="msg err" id="msg"></p>
      </form>`);
    document.getElementById('f').onsubmit = async ev => {
      ev.preventDefault();
      const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value, msg = document.getElementById('msg');
      if (p1 !== p2) { msg.textContent = 'Passordene er ikke like.'; return; }
      busy(document.getElementById('go'), true);
      try {
        await confirmPasswordReset(auth, code, p1);
        show(`<p class="ok">Passordet er endret.</p><div class="actions"><a class="btn primary" href="${appUrl}">Logg inn i WRK2</a></div>`);
      } catch (err) { msg.textContent = errText(err); busy(document.getElementById('go'), false); }
    };
  }).catch(fail);
} else if (mode === 'recoverEmail') {
  show(`<p>E-postadressen på kontoen din er nylig endret. Trykk på knappen for å sette tilbake den forrige adressen.</p>
    <div class="actions"><button class="btn primary" id="go">Sett tilbake e-postadressen</button></div>`);
  document.getElementById('go').onclick = async e => {
    busy(e.target, true);
    try {
      const info = await checkActionCode(auth, code);
      await applyActionCode(auth, code);
      show(`<p class="ok">E-postadressen er satt tilbake til ${esc(info.data.email)}.</p>
        <p>Endret du den ikke selv, bør du lage nytt passord fra innloggingssiden.</p><div class="actions">${toApp}</div>`);
    } catch (err) { fail(err); }
  };
} else {
  show(`<p>Ukjent lenke.</p><div class="actions">${toApp}</div>`);
}
</script>
</body>
</html>
