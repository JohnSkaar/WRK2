[build]
  command = "echo 'Static site - no build needed'"
  publish = "."

# Kildefiler i repoet skal ikke kunne lastes ned fra nettsiden.
[[redirects]]
  from = "/WRK2_Aktivitetsoversikt.xlsx"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/oversikt.html"
  status = 200

[context.production]
  environment = { CONTEXT = "production" }

[context.deploy-preview]
  environment = { CONTEXT = "deploy-preview" }

[context.branch-deploy]
  environment = { CONTEXT = "branch-deploy" }
